<div class="app-container">
    <app-sidebar mode="MEMBER"></app-sidebar>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="page-header">
                <h1 class="page-title">填寫紀錄</h1>
                <p class="page-subtitle">查看您過去參與過的所有問卷調查。</p>
            </div>

            <div class="card table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th width="80">編號</th>
                            <th>問卷名稱</th>
                            <th width="180">填寫時間</th>
                            <th width="100">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        @if (isLoading()) {
                        <tr>
                            <td colspan="4" class="text-center p-lg">載入中...</td>
                        </tr>
                        } @else if (responses().length === 0) {
                        <tr>
                            <td colspan="4" class="text-center p-lg">您尚未填寫過任何問卷</td>
                        </tr>
                        } @else {
                        @for (item of responses(); track item.response_id) {
                        <tr>
                            <td>{{ item.response_id }}</td>
                            <td class="text-ellipsis" [title]="item.survey_title">{{ item.survey_title }}</td>
                            <td>{{ item.submitted_at | date:'yyyy-MM-dd HH:mm' }}</td>
                            <td>
                                <div class="action-buttons">
                                    <a [routerLink]="['/member/responses', item.response_id]"
                                        class="btn-icon text-primary" title="查看詳情">
                                        <lucide-icon [img]="icons.Eye" [size]="20"></lucide-icon>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        }
                        }
                    </tbody>
                </table>
            </div>

            <div class="pagination-wrapper">
                <app-pagination
                    [currentPage]="currentPage()"
                    [totalPages]="totalPages()"
                    [totalItems]="totalElements()"
                    [showTotalItems]="true"
                    (pageChange)="onPageChange($event)">
                </app-pagination>
            </div>
        </div>
    </main>
</div>
