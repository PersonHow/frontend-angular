<div class="app-container">
    <app-sidebar mode="MEMBER"></app-sidebar>

    <main class="main-content">
        <div class="content-wrapper">

            <div class="page-header">
                <h1 class="page-title">新增問卷</h1>

                <div class="stepper">
                    <div class="step-item" [class.active]="currentStep() >= 1" [class.current]="currentStep() === 1"
                        (click)="onStepClick(1)">
                        <div class="step-circle">1</div>
                        <span class="step-label">基本資料</span>
                    </div>

                    <div class="step-line"></div>

                    <div class="step-item" [class.active]="currentStep() >= 2" [class.current]="currentStep() === 2"
                        (click)="onStepClick(2)">
                        <div class="step-circle">2</div>
                        <span class="step-label">題目設計</span>
                    </div>

                    <div class="step-line"></div>

                    <div class="step-item" [class.active]="currentStep() >= 3" [class.current]="currentStep() === 3">
                        <div class="step-circle">3</div>
                        <span class="step-label">預覽發佈</span>
                    </div>
                </div>
            </div>

            <div class="step-content">
                @switch (currentStep()) {
                @case (1) {
                <app-step-basic-info [initialData]="surveyData()" (stepSubmit)="onBasicInfoSubmit($event)">
                </app-step-basic-info>
                }

                @case (2) {
                <app-step-questions [initialQuestions]="surveyData().questions" (prevStep)="goToStep(1)"
                    (stepSubmit)="onQuestionsSubmit($event)">
                </app-step-questions>
                }

                @case (3) {
                <app-step-preview [surveyData]="surveyData()" (editStep)="goToStep($event)"
                    (submit)="onFinalSubmit($event)">
                </app-step-preview>
                }
                }
            </div>

        </div>
    </main>

    @if (isLoading()) {
    <div class="loading-overlay">
        <div class="spinner"></div>
        <p>處理中，請稍候...</p>
    </div>
    }
</div>
