<form [formGroup]="searchForm" class="search-bar" (ngSubmit)="onSearch()">
    <div class="search-fields">
        @for(field of fields(); track field.name){
        <div class="field-wrapper">
            @if(field.type === 'text'){
            <input type="text" [formControlName]="field.name" [placeholder]="field.placeholder || field.label"
                class="search-input" />
            }

            @if(field.type === 'date'){
            <input type="date" [formControlName]="field.name" class="search-input"
                   [min]="field.name === 'endDate' ? searchForm.get('startDate')?.value : null"
                   [max]="field.name === 'startDate' ? searchForm.get('endDate')?.value : null">
            }

            @if(field.type === 'select' && field.options){
            <select [formControlName]="field.name" class="search-input">
                <option value="">{{field.placeholder || field.label}}</option>
                @for(option of field.options; track option.value){
                <option [value]="option.value">{{option.label}}</option>
                }
            </select>
            }
        </div>
        }
    </div>

    <div class="search-actions">
        <button class="btn-search" type="submit" title="搜尋">
            <lucide-icon [img]="SearchIcon" [size]="20"></lucide-icon>
            <!-- <span class="btn-text">搜尋</span> -->
        </button>
        <button class="btn-reset" type="button" (click)="onReset()" title="重置">
            <lucide-icon [img]="ResetIcon" [size]="20"></lucide-icon>
        </button>
    </div>
</form>
