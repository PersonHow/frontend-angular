server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. 處理 Angular 路由：所有的路徑都導回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # 針對 index.html 強制不快取
        # 這樣瀏覽器每次載入頁面時，都會回伺服器確認有沒有新的樣式/程式碼路徑
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. 針對靜態資源（JS, CSS, 圖片等）進行快取優化
    # 因為 Angular build 出來的這些檔案檔名自帶雜湊值（如 styles.abc123.css）
    # 只要內容有變，檔名就會變，所以我們可以放心地讓瀏覽器快取它們
    location ~* \.(?:js|css|jpg|jpeg|gif|png|svg|ico|woff|woff2|ttf|otf)$ {
        expires 1y;             # 快取一年
        add_header Cache-Control "public, immutable"; 
        access_log off;         # 關閉 Log 減少硬碟讀寫
    }

    # 錯誤頁面設定
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
